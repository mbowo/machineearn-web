<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MachineEarn Demo</title><link rel="stylesheet" href="style.css"></head>
<body><header><b>MachineEarn</b><nav><button onclick="show('home')">Home</button><button onclick="show('machines')">Machines</button><button onclick="show('earnings')">Earnings</button><button onclick="show('activity')">Activity</button><button onclick="show('profile')">Profile</button><button id="loginNav" onclick="show('auth')">Login</button></nav></header>
<main><section id="home" class="screen"><div class="hero"><h1>Build with machines.</h1><p>Educational demo of a machine marketplace and revenue dashboard.</p><div id="welcome"></div></div><div class="cards"><div><span>Demo balance</span><strong id="balance">KSh 0</strong></div><div><span>My machines</span><strong id="count">0</strong></div><div><span>Status</span><strong>Demo only</strong></div></div></section>
<section id="machines" class="screen hidden"><h2>Machines</h2><div id="paymentBox" class="panel"></div><div id="machineList" class="grid"></div></section>
<section id="earnings" class="screen hidden"><h2>Earnings & withdrawals</h2><div id="earningsBox"></div></section><section id="activity" class="screen hidden"><h2>My Machines & Activity</h2><div id="activityBox"></div></section>
<section id="profile" class="screen hidden"><h2>Profile</h2><div id="profileBox"></div></section>
<section id="auth" class="screen hidden"><div class="auth"><h2>Login / Register</h2><input id="name" placeholder="Name"><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password (6+ chars)"><button onclick="register()">Create account</button><button onclick="login()">Login</button><p id="authMsg"></p></div></section>
</main><footer>MachineEarn • Educational demo • No real-money transactions</footer><script src="app.js"></script></body></html>
